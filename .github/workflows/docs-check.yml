name: Docs Sync Check

# Flags README.md / CLAUDE.md that look out of date given a PR's diff.
# Comment-only: allowedTools below excludes Edit/Write, so it cannot modify
# files or push commits — it can only read the repo and post a PR comment.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            This repo is DASH, documented in README.md and CLAUDE.md at the
            repo root. Run `git diff origin/${{ github.base_ref }}...HEAD` to
            see this PR's changes.

            Check whether the diff introduces anything that README.md or
            CLAUDE.md should mention but currently doesn't — for example: new
            or changed API routes, npm scripts, env vars, dependencies,
            architecture/layer changes, hosting/infra assumptions, or
            first-time-setup steps.

            Post a single PR comment:
            - If docs look up to date, say so in one line and stop.
            - Otherwise, list each gap as: file, section/line, what's stale,
              and the specific suggested wording.

            Do not edit any files or make commits — this is an advisory
            comment only.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*)"
